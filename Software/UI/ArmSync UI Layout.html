<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 800px;
    height: 480px;
    background: rgb(241, 245, 248);
    padding: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-content: flex-start;
  }

  .card {
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 3px 16px rgba(0,0,0,0.22),
                0 0 0 1px rgba(0,0,0,0.05);
  }

  .card-stop {
    background: #e5484d;
    border-radius: 14px;
    box-shadow: 0 3px 16px rgba(230, 57, 57, 0.84),
                0 0 0 1px rgba(128, 35, 35, 0.05);
  }

  /* ---- title bar ---- */
  .title-bar {
    width: 760px;
    height: 36px;
    display: flex;
    align-items: center;
    font-family: 'Cascadia Code', 'Consolas', monospace;
    font-size: 34px;
    font-weight: 700;
    color: #1a1d2e;
    letter-spacing: 4px;
    padding: 0 8px 6px;
  }

  .title-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: rgb(48, 64, 152);
    margin-right: 14px;
    box-shadow: 0 0 10px rgba(48,64,152,.7);
  }

  /* ---- layout ---- */
  .left-col, .right-col {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 360px;
  }

  /* ---- buttons ---- */
  .btn-row {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 0 12px;
  }
  .btn {
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    padding: 17px 0;
  }
  .btn svg {
    width: 38px;
    height: 38px;
  }
  .btn-stop svg {
    width: 54px;
    height: 54px;
  }
  .btn-home  { background: rgb(48,64,152); color: #fff; }
  .btn-rec   { background: #3dd68c; color: #fff; }
  .btn-play  { background: #f5a623; color: #fff; }
  .btn-stop  { background: #e5484d; color: #fff; }
</style>
</head>
<body>

<!-- Title -->
<div class="title-bar">
  <div class="title-dot"></div>
  ARMSYNC DASHBOARD
</div>

<!-- Left column -->

  <div class="card" style="height:90px"></div>
  <div class="card" style="height:176px"></div>

</html>
